[package]
name = "r4-ferogram"
version = "0.0.0"
edition = "2021"
publish = false
description = "SPIKE-10 nhánh R4 — IngestRpc bằng ferogram (docs/spikes/README.md#spike-10)."

[dependencies]
ingest-rpc-trait = { path = "../rpc-trait" }
ferogram = "0.6.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "signal", "sync", "time"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
