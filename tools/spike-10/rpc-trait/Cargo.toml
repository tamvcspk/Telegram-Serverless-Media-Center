publish = false
description = "Trait IngestRpc dùng chung cho r3-grammers/r4-ferogram (SPIKE-10) — bảy thao tác RPC, không chứa luật nghiệp vụ (bảng phân hạng A/B/C/D vẫn ở libs/core-ingest TypeScript, xem docs/spikes/README.md#spike-10)."

[dependencies]
