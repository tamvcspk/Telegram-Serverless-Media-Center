<section class="collections" aria-label="Bộ sưu tập của tôi">
  @if (collections().length === 0) {
    <p class="hint">Chưa có bộ sưu tập nào — bấm nút "+" góc dưới để tạo bộ sưu tập đầu tiên.</p>
  } @else {
    <div class="tile-grid">
      @for (collection of collections(); track trackByCollection($index, collection)) {
        <div class="tile-card">
          <a class="tile-link" [routerLink]="['/home/collections', collection.id]">
            <app-poster-tile [label]="collection.name" />
            <span class="name">{{ collection.name }}</span>
            <span class="count">{{ collection.items.length }} phim</span>
          </a>
          <button
            mat-icon-button
            type="button"
            class="tile-menu-btn"
            aria-label="Tuỳ chọn bộ sưu tập"
            [matMenuTriggerFor]="tileMenu"
            (click)="$event.stopPropagation(); onOpenTileMenu(collection)"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <circle cx="12" cy="5" r="1.5" />
              <circle cx="12" cy="12" r="1.5" />
              <circle cx="12" cy="19" r="1.5" />
            </svg>
          </button>
        </div>
      }
    </div>
  }

  <mat-menu #tileMenu="matMenu">
    <button mat-menu-item (click)="onRename()">Đổi tên</button>
    <button mat-menu-item (click)="onDeleteCollection()">Xoá bộ sưu tập</button>
  </mat-menu>

  <button mat-fab class="create-fab" type="button" aria-label="Tạo bộ sưu tập mới" (click)="onCreate()">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>
</section>
