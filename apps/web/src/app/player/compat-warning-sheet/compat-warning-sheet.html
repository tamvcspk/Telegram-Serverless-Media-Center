<div class="compat-sheet">
  <h2>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.5 22 20.5H2Z" />
      <path d="M12 10v4.5" />
      <circle cx="12" cy="17.5" r="0.6" fill="currentColor" stroke="none" />
    </svg>
    Cảnh báo tương thích
  </h2>
  <p>{{ warningText }}</p>

  <div class="actions">
    @if (data.deepLink) {
      <button mat-stroked-button type="button" (click)="onOpenTelegram()">Mở trên Telegram</button>
    }
    <button mat-flat-button type="button" (click)="onPlayAnyway()">Vẫn thử phát</button>
  </div>
</div>
