[package]
name = "tsmc-ingest-desktop"
version = "0.1.0"
description = "TSMC — GUI ingest desktop (ADR-0017)"
authors = ["TSMC"]
license = "MIT"
repository = ""
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ingest-rpc-trait = { path = "../ingest-rpc-trait" }
ingest-grammers = { path = "../ingest-grammers" }
grammers-client = { workspace = true }
grammers-session = { workspace = true }
tokio = { workspace = true }
serde_json = "1.0"
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
