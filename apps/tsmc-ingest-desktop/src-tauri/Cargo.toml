[package]
name = "tsmc-ingest-desktop"
version = "0.1.0"
description = "TSMC — GUI ingest desktop (ADR-0017)"
authors = ["TSMC"]
license = "MIT"
repository = ""
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ingest-rpc-trait = { path = "../ingest-rpc-trait" }
ingest-grammers = { path = "../ingest-grammers" }
ingest-ffmpeg = { path = "../ingest-ffmpeg" }
grammers-client = { workspace = true }
tokio = { workspace = true }
serde_json = "1.0"
serde = { workspace = true }
log = "0.4"
# TMDB (ADR-0019) — dịch vụ Internet thật ngoài Telegram, dùng default-tls
# (schannel trên Windows qua native-tls) — không cần thêm dependency hệ
# thống nào khác trên máy đã build được app này.
reqwest = { version = "0.12", features = ["json"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
# ADR-0021 — sinh key mã hoá `session.sqlite3` bằng CSPRNG (`OsRng`,
# `secret_store::load_or_generate_key()`). Ghim CỨNG (đã có sẵn trong
# Cargo.lock qua `keyring`/`libsql` transitively, xem doc comment
# `../Cargo.toml` cạnh `libsql`) — dùng cho mục đích bảo mật, không để
# `cargo update` âm thầm đổi phiên bản RNG.
rand = "=0.8.8"
tauri-plugin-clipboard-manager = "2"
