[workspace]
resolver = "2"
members = ["ingest-rpc-trait", "ingest-grammers", "ingest-ffmpeg", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"

# ADR-0017 điều kiện bắt buộc #1: ghim cứng grammers-client (không "^") — cùng
# lý do CLAUDE.md bất biến #9 ghim `telegram@2.26.22`. Ghim CẢ NĂM crate
# grammers-*, không chỉ grammers-client — tools/spike-10/r3-grammers/Cargo.toml
# chỉ ghim lỏng "0.10.0" (chấp nhận được cho spike, không chấp nhận được cho
# app thật). Mọi crate thành viên tham chiếu qua `{ workspace = true }` để
# không ai vô tình gõ lại pin sai khi thêm crate mới.
[workspace.dependencies]
grammers-client = { version = "=0.10.0", features = ["fs"] }
grammers-session = { version = "=0.10.0", features = ["sqlite-storage"] }
grammers-mtsender = "=0.10.0"
grammers-mtproto = "=0.10.0"
grammers-tl-types = "=0.10.0"
# ADR-0021: `ingest-grammers::encrypted_session` fork tay schema/API của
# `grammers-session` 0.10.0's `storages/sqlite.rs` (bản dùng `libsql` nội bộ
# — kiểm `grammers-session-0.10.0/Cargo.toml` nếu nâng version) để mở
# `session.sqlite3` kèm `EncryptionConfig`. Ghim CỨNG (không "^") ĐÚNG version
# đó — cùng lý do CLAUDE.md bất biến #9/grammers-* ở trên: khác version là
# khác schema/API tiềm ẩn mà module fork không tự dò được, chỉ vỡ lặng lẽ lúc
# chạy (đọc sai cột, panic, hoặc tệ hơn — đọc "được" nhưng sai dữ liệu).
# **Nâng cấp `grammers-session` HOẶC `libsql` bắt buộc đối chiếu lại
# `sqlite.rs` gốc của bản mới trước khi merge** — checklist ở
# docs/adr/0021-ma-hoa-session-sqlite-qua-session-tu-implement.md.
libsql = { version = "=0.9.30", default-features = false, features = ["core", "encryption"] }
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }

# Cùng version đã verify thật ở SPIKE-09 (tools/spike-09/Cargo.toml,
# docs/adr/0013-bot-dong-hanh-va-pipeline-ingest.md § addendum 2026-09-03/04)
# — không ghim cứng "=" như grammers-* (rủi ro khác nhau: grammers bị archive,
# ffmpeg-next vẫn đang bảo trì bình thường).
ffmpeg-next = "7"
