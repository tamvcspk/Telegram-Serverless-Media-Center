[package]
name = "ingest-grammers"
version.workspace = true
edition.workspace = true
publish = false
description = "Implementation IngestRpc bằng grammers-client 0.10.0 (ADR-0017)."

[dependencies]
ingest-rpc-trait = { path = "../ingest-rpc-trait" }
grammers-client = { workspace = true }
grammers-session = { workspace = true }
grammers-mtsender = { workspace = true }
grammers-mtproto = { workspace = true }
grammers-tl-types = { workspace = true }
# ADR-0021 — `encrypted_session.rs` (thay `grammers_session::storages::
# SqliteSession`, xem doc comment ở đó). Ghim ở workspace root, xem lý do ở
# `../Cargo.toml`.
libsql = { workspace = true }
bytes = "1"
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
rand = "0.8"
log = "0.4"

# Chi cho examples/upload_bench.rs (Ctrl+C an toan khi do).
[dev-dependencies]
tokio = { workspace = true, features = ["signal"] }
